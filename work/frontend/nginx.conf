server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: strip /api prefix, forward to the backend service
    # (Docker Compose service name "backend", port 8000) — mirrors the
    # Vite dev proxy in vite.config.js so the frontend code needs zero
    # changes between dev and container deployment.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20M;   # allow reasonably large CSV/PDF uploads
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
